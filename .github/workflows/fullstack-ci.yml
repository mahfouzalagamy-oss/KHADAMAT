name: KHADAMAT Full-Stack CI & Signed Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout KHADAMAT Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FastAPI & Pytest Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full KHADAMAT Pytest Regression Suite (31 Tests)
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: khadamat_test_db
          JWT_SECRET: khadamat-ci-jwt-secret-2026
          DEMO_OTP: "123456"
          DEMO_AUTO_OFFERS: "true"
          EMERGENT_LLM_KEY: ""
          PAYMENT_GATEWAY_API_KEY: ""
          EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8000 &
          sleep 4
          curl -f http://127.0.0.1:8000/health
          pytest tests/test_backend.py -v

  build-signed-android-release:
    needs: backend-regression-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout KHADAMAT Repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Expo Dependencies, Prebuild & Sign Android APK + AAB
        working-directory: ./frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://api.khadamat.app
        run: |
          corepack enable
          yarn install
          npx expo install expo-image-picker
          npx expo prebuild --platform android --non-interactive
          keytool -genkeypair -keystore android/app/upload-keystore.jks -alias khadamat_key -keyalg RSA -keysize 2048 -validity 10000 -storepass Khadamat2026! -keypass Khadamat2026! -dname "CN=KHADAMAT Official, OU=Engineering, O=KHADAMAT, L=Mansoura, S=Dakahlia, C=EG"
          if [ -f android/app/build.gradle ]; then
            python3 -c '
p = "android/app/build.gradle"
s = open(p).read()
s = s.replace("signingConfigs {", """signingConfigs {
        release {
            storeFile file("upload-keystore.jks")
            storePassword "Khadamat2026!"
            keyAlias "khadamat_key"
            keyPassword "Khadamat2026!"
        }""")
parts = s.split("signingConfig signingConfigs.debug")
if len(parts) >= 3:
    s = parts[0] + "signingConfig signingConfigs.debug" + parts[1] + "signingConfig signingConfigs.release" + "signingConfig signingConfigs.debug".join(parts[2:])
elif len(parts) == 2:
    s = parts[0] + "signingConfig signingConfigs.release" + parts[1]
open(p, "w").write(s)
'
          fi
          if [ -f android/app/build.gradle.kts ]; then
            python3 -c '
p = "android/app/build.gradle.kts"
s = open(p).read()
s = s.replace("signingConfigs {", """signingConfigs {
        create("release") {
            storeFile = file("upload-keystore.jks")
            storePassword = "Khadamat2026!"
            keyAlias = "khadamat_key"
            keyPassword = "Khadamat2026!"
        }""")
parts = s.split("signingConfig = signingConfigs.getByName(\"debug\")")
if len(parts) >= 3:
    s = parts[0] + "signingConfig = signingConfigs.getByName(\"debug\")" + parts[1] + "signingConfig = signingConfigs.getByName(\"release\")" + "signingConfig = signingConfigs.getByName(\"debug\")".join(parts[2:])
open(p, "w").write(s)
'
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-expo-signed-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-expo-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab