name: KHADAMAT Full-Stack CI & Signed Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout KHADAMAT Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FastAPI & Pytest Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full KHADAMAT Pytest Regression Suite (31 Tests)
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: khadamat_test_db
          JWT_SECRET: khadamat-ci-jwt-secret-2026
          DEMO_OTP: "123456"
          DEMO_AUTO_OFFERS: "true"
          EMERGENT_LLM_KEY: ""
          PAYMENT_GATEWAY_API_KEY: ""
          EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8000 &
          sleep 4
          curl -f http://127.0.0.1:8000/health
          pytest tests/test_backend.py -v

  build-signed-android-release:
    needs: backend-regression-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout KHADAMAT Repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Expo Dependencies, Verify JS Bundle & Sign Android APK + AAB
        working-directory: ./frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://api.khadamat.app
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          corepack enable
          yarn install
          npx expo install expo-image-picker
          python3 scripts/sign-android.py assets
          npx expo export --platform android --output-dir /tmp/expo-bundle-check
          npx expo prebuild --platform android --non-interactive
          python3 scripts/sign-android.py sign
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-expo-signed-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: khadamat-expo-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab