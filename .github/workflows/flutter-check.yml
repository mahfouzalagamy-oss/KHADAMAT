name: Flutter checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
      - name: Prepare Android and web hosts
        run: |
          flutter create --no-pub --empty --org com.khadamat.official \
            --project-name khadamat_app --platforms android,web .
          git diff --exit-code -- pubspec.yaml pubspec.lock lib test
          sed -i '/^<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' \
            android/app/src/main/AndroidManifest.xml
          sed -i '/signingConfig = signingConfigs.getByName("debug")/d' android/app/build.gradle.kts
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test --no-pub
      - name: Build web
        run: flutter build web --no-pub --release --base-href /KHADAMAT/ --no-tree-shake-icons
      - name: Build Android verification packages
        run: |
          flutter build apk --no-pub --release --no-tree-shake-icons
          flutter build appbundle --no-pub --release --no-tree-shake-icons
      - name: Verify Android manifest and bundle
        run: |
          apkanalyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          test "$("$apkanalyzer" manifest application-id "$apk")" = com.khadamat.official.khadamat_app
          "$apkanalyzer" manifest permissions "$apk" | grep -Fx android.permission.INTERNET
          # Release compilation runs without a Play upload key on pull requests.
          bundles=(build/app/outputs/bundle/release/*.aab)
          test "${#bundles[@]}" -eq 1
          test -s "${bundles[0]}"
          keytool -printcert -jarfile "${bundles[0]}" | tee "$RUNNER_TEMP/khadamat-bundle-signing.txt"
          grep -Fx 'Not a signed jar file' "$RUNNER_TEMP/khadamat-bundle-signing.txt"
