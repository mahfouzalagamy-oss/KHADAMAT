name: Supabase database checks

on:
  pull_request:
    branches: [main, codex/phase-1-flutter-checks]
    paths:
      - 'supabase/**'
      - 'mobile_app/**'
      - '.github/workflows/supabase-check.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: '2.84.4'
      - name: Start isolated PostgreSQL
        run: supabase db start
      - name: Verify identity and permissions
        run: supabase test db --local
  flutter-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - run: flutter test --no-pub
