name: Supabase database checks

on:
  pull_request:
    branches: [main, codex/phase-1-flutter-checks]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-check.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: '2.84.4'
      - name: Start isolated PostgreSQL
        run: supabase db start
      - name: Verify identity and permissions
        run: supabase test db --local
